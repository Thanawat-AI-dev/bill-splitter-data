<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>หารบิล — Bill Splitter</title>
<meta name="description" content="แอปหารบิลแบบโปรเจกต์ สร้างแดชบอร์ดสรุป และ Export เป็น PDF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0c0f14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=4">
<!-- Chart.js powers the summary dashboard (a core view) so it loads up front.
     html2canvas + jsPDF (~540KB) are loaded on demand at first Export, and the
     PromptPay QR lib only when a QR is shown — see loadScriptOnce in app.js. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app-shell">

    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">🧾</span>
        <div>
          <h1>หารบิล</h1>
          <p>สร้างโปรเจกต์หารบิล สรุปยอดอัตโนมัติ</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="gh-status" id="gh-status" title="สถานะบัญชีผู้ใช้">
          <span class="dot"></span><span class="gh-status-text">ยังไม่เข้าสู่ระบบ</span>
        </span>
        <button class="btn ghost sm" id="admin-btn" style="display:none;">ผู้ดูแลระบบ</button>
        <button class="btn ghost sm" id="logout-btn" style="display:none;">ออกจากระบบ</button>
        <button class="icon-btn" id="theme-toggle" title="สลับธีมมืด/สว่าง">🌙</button>
      </div>
    </header>

    <main id="view-root" class="view-root">
      <!-- Rendered dynamically by app.js -->
    </main>

  </div>

  <!-- Confirm Modal (generic) -->
  <div class="modal-overlay" id="confirm-modal">
    <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <div class="modal-card-head">
        <h2 id="confirm-title">ยืนยันการทำรายการ</h2>
      </div>
      <p id="confirm-body"></p>
      <div class="modal-actions">
        <button class="btn ghost" id="confirm-cancel">ยกเลิก</button>
        <button class="btn danger" id="confirm-ok">ยืนยัน</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
  </div>

  <script src="app.js?v=12" defer></script>
</body>
</html>
